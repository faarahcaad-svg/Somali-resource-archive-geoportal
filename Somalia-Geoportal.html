<script>
  (function() {
    // 1. Attach Cold Reboot Event Listener to Master Title Crosshair Button
    const rebootBtn = document.getElementById('snr-master-reboot-crosshair');
    if (rebootBtn) {
      rebootBtn.addEventListener('click', function(e) {
        e.preventDefault();
        if (window.SNR_DISPATCH) {
          window.SNR_DISPATCH('COLD_REBOOT');
        }
        const mainVp = document.getElementById('snr-main-viewport');
        if (mainVp) {
          mainVp.scrollTo({ top: 0, behavior: 'smooth' });
        }
      });
    }

    // 2. Attach Return-to-Top Event Listener to Floating Reticle Button
    const floatBtn = document.getElementById('snr-floating-reticle-btn');
    if (floatBtn) {
      floatBtn.addEventListener('click', function(e) {
        e.preventDefault();
        const mainVp = document.getElementById('snr-main-viewport');
        if (mainVp) {
          mainVp.scrollTo({ top: 0, behavior: 'smooth' });
        }
        if (window.SNR_DISPATCH) {
          window.SNR_DISPATCH('RESET_CROSSHAIR', {});
        }
      });
    }
  })();
</script>

    window.SNR_STATE = {
      isBoot: true,

      },

    };

    // ========================================================================
    // 4. GLOBAL EVENT BUS & DISPATCHER (WITH ZERO-FAIL REBOOT & TARGETING)
    // ========================================================================
    window.SNR_DISPATCH = function(action, payload) {
      payload = payload || {};
      const state = window.SNR_STATE;

      switch (action) {
        case 'COLD_REBOOT':
          state.isBoot = true;
          state.activeModKey = 'MOD_01';
          state.activeSubId = null;
          state.activeSscId = null;
          state.activeAssetId = null;
          state.isSimulating = false;
          state.simStep = 0;
          state.zoom = 8.5;
          state.opacity = 0.85;
          state.mapCenter = [7.0500, 39.7500];
          state.crosshairTarget = null;
          
          const mod01 = window.SNR_DATA_STORE['MOD_01'];
          if (mod01 && mod01.subCategories && mod01.subCategories.length > 0) {
            state.activeSubId = mod01.subCategories[0].id;
            if (mod01.subCategories[0].subSubs && mod01.subCategories[0].subSubs.length > 0) {
              state.activeSscId = mod01.subCategories[0].subSubs[0].id;
              if (mod01.subCategories[0].subSubs[0].assets && mod01.subCategories[0].subSubs[0].assets.length > 0) {
                state.activeAssetId = mod01.subCategories[0].subSubs[0].assets[0].id;
                state.mapCenter = mod01.subCategories[0].subSubs[0].assets[0].coords || state.mapCenter;
              }
            }
          }
          break;

        case 'SELECT_MODULE':
          state.isBoot = false;
          state.activeModKey = payload.modKey;
          const targetMod = window.SNR_DATA_STORE[payload.modKey];
          if (targetMod && targetMod.subCategories && targetMod.subCategories.length > 0) {
            state.activeSubId = targetMod.subCategories[0].id;
            if (targetMod.subCategories[0].subSubs && targetMod.subCategories[0].subSubs.length > 0) {
              state.activeSscId = targetMod.subCategories[0].subSubs[0].id;
              if (targetMod.subCategories[0].subSubs[0].assets && targetMod.subCategories[0].subSubs[0].assets.length > 0) {
                state.activeAssetId = targetMod.subCategories[0].subSubs[0].assets[0].id;
                state.mapCenter = targetMod.subCategories[0].subSubs[0].assets[0].coords || state.mapCenter;
              }
            }
          } else {
            state.activeSubId = null;
            state.activeSscId = null;
            state.activeAssetId = null;
          }
          break;

        case 'SELECT_SUB':
          state.activeSubId = payload.subId;
          const curMod = window.SNR_DATA_STORE[state.activeModKey];
          if (curMod) {
            const curSub = curMod.subCategories.find(function(s) { return s.id === payload.subId; });
            if (curSub && curSub.subSubs && curSub.subSubs.length > 0) {
              state.activeSscId = curSub.subSubs[0].id;
              if (curSub.subSubs[0].assets && curSub.subSubs[0].assets.length > 0) {
                state.activeAssetId = curSub.subSubs[0].assets[0].id;
                state.mapCenter = curSub.subSubs[0].assets[0].coords || state.mapCenter;
              }
            }
          }
          break;

        case 'SELECT_SSC':
          state.activeSscId = payload.sscId;
          const parentMod = window.SNR_DATA_STORE[state.activeModKey];
          if (parentMod) {
            const parentSub = parentMod.subCategories.find(function(s) { return s.id === state.activeSubId; });
            if (parentSub) {
              const sscMatch = parentSub.subSubs.find(function(ssc) { return ssc.id === payload.sscId; });
              if (sscMatch && sscMatch.assets && sscMatch.assets.length > 0) {
                state.activeAssetId = sscMatch.assets[0].id;
                state.mapCenter = sscMatch.assets[0].coords || state.mapCenter;
              }
            }
          }
          break;

        case 'SELECT_ASSET':
        case 'INITIATE_TARGET':
          state.activeAssetId = payload.assetId;
          if (payload.coords) {
            state.mapCenter = payload.coords;
            state.crosshairTarget = payload.coords;
          }
          break;

        case 'RESET_CROSSHAIR':
          state.crosshairTarget = null;
          break;

        case 'TOGGLE_LAYER':
          if (payload.layerName && state.layers.hasOwnProperty(payload.layerName)) {
            state.layers[payload.layerName] = !state.layers[payload.layerName];
          }
          break;

        case 'TOGGLE_SIMULATION':
          state.isSimulating = !state.isSimulating;
          break;

        case 'SET_ZOOM':
          state.zoom = Math.max(0.0, Math.min(24.0, payload.zoom));
          break;

        case 'SET_OPACITY':
          state.opacity = Math.max(0.0, Math.min(1.0, payload.opacity));
          break;

        default:
          break;
      }

      // Notify all registered state listeners
      state.listeners.forEach(function(listenerFn) {
        try { listenerFn(state); } catch (e) { console.error('SNR_EVENT_ERR:', e); }
      });
    };

    window.SNR_SUBSCRIBE = function(listenerFn) {
      if (typeof listenerFn === 'function') {
        window.SNR_STATE.listeners.push(listenerFn);
      }
    };

    // ========================================================================
    // 5. GLOBAL SIMULATION TICKER LOOP

    function globalSimLoop() {

        window.SNR_STATE.simStep = (window.SNR_STATE.simStep + 1) % 10000;

        if (simTickerEl) {
          simTickerEl.textContent = 'STEP: #' + window.SNR_STATE.simStep.toString().padStart(4, '0');
        }
      }
      requestAnimationFrame(globalSimLoop);
    }
    requestAnimationFrame(globalSimLoop);

  })();

        if (mod.theater === theaterKey) {
          const chip = document.createElement('div');
          chip.className = 'module-chip' + (modKey === activeModKey ? ' active' : '');
          chip.setAttribute('data-mod', modKey);
          chip.innerHTML = '<span style="color:' + mod.color + '; font-weight:900;">' + mod.reticle + '</span> ' + mod.code + ': ' + mod.name;
          
          chip.addEventListener('click', function() {
            if (window.SNR_DISPATCH) {
              window.SNR_DISPATCH('SELECT_MODULE', { modKey: modKey });
            }
          });
          deckEl.appendChild(chip);
        }
      });
    }

    // 2. Attach Theater Navigation Button Listeners
    const theaterBar = document.getElementById('snr-theater-bar');
    if (theaterBar) {
      theaterBar.addEventListener('click', function(e) {
        const btn = e.target.closest('.theater-btn');
        if (!btn) return;

        const theater = btn.getAttribute('data-theater');
        if (theater && theater !== currentTheater) {
          currentTheater = theater;
          theaterBar.querySelectorAll('.theater-btn').forEach(function(b) { b.classList.remove('active'); });
          btn.classList.add('active');
          renderModuleDeck(theater);

          // Auto-select first module of selected theater
          const reg = window.SNR_RPG_REGISTRY;
          const firstMod = Object.keys(reg).find(function(k) { return reg[k].theater === theater; });
          if (firstMod && window.SNR_DISPATCH) {
            window.SNR_DISPATCH('SELECT_MODULE', { modKey: firstMod });
          }
        }
      });
    }

    // 3. Layer Matrix Toggle Handlers
    const layerBar = document.getElementById('snr-layer-toggles');
    if (layerBar) {
      layerBar.addEventListener('click', function(e) {
        const btn = e.target.closest('.layer-toggle-btn');
        if (!btn) return;

        const layerName = btn.getAttribute('data-layer');
        if (layerName && window.SNR_DISPATCH) {
          window.SNR_DISPATCH('TOGGLE_LAYER', { layerName: layerName });
          btn.classList.toggle('active');
        }
      });
    }

    // 4. Simulation Toggle Button Handler
    const simBtn = document.getElementById('snr-sim-toggle-btn');
    const simLabel = document.getElementById('snr-sim-status-label');
    if (simBtn) {
      simBtn.addEventListener('click', function() {
        if (window.SNR_DISPATCH) {
          window.SNR_DISPATCH('TOGGLE_SIMULATION', {});
          const isSim = window.SNR_STATE.isSimulating;
          simBtn.classList.toggle('active', isSim);
          if (simLabel) simLabel.textContent = isSim ? 'ON' : 'OFF';
        }
      });
    }

    // 5. Subscribe to Global State Changes
    if (window.SNR_SUBSCRIBE) {
      window.SNR_SUBSCRIBE(function(state) {
        // Sync active module chip highlight
        const activeChip = document.querySelector('#snr-module-deck .module-chip[data-mod="' + state.activeModKey + '"]');
        if (activeChip) {
          document.querySelectorAll('#snr-module-deck .module-chip').forEach(function(c) { c.classList.remove('active'); });
          activeChip.classList.add('active');
        } else {
          // If active module is in another theater, switch theater tabs
          const modMeta = window.SNR_RPG_REGISTRY[state.activeModKey];
          if (modMeta && modMeta.theater !== currentTheater) {
            currentTheater = modMeta.theater;
            const tBtn = document.querySelector('#snr-theater-bar .theater-btn[data-theater="' + currentTheater + '"]');
            if (tBtn) {
              document.querySelectorAll('#snr-theater-bar .theater-btn').forEach(function(b) { b.classList.remove('active'); });
              tBtn.classList.add('active');
              renderModuleDeck(currentTheater);
            }
          }
        }
      });
    }

    // Initial render of Theater Alpha modules on script load
    renderModuleDeck('ALPHA');

    // Mount navigation strip to top of viewport
    const vp = document.getElementById('snr-main-viewport');
    const strip = document.getElementById('snr-nav-command-strip');
    if (vp && strip && strip.parentNode !== vp) {
      vp.insertBefore(strip, vp.firstChild);
    }
  })();
</script>
